spring.application.name=soundboard

server.port=8080

###### POSTGRESQL DATABASE CONFIG
spring.jpa.show-sql=true
#create or update tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

###### SECURITY DEBUG LOGGING
logging.level.org.springframework.security=DEBUG

# set to native to let the Tomcat server handle the headers, Tomcat RemoteIpValue.
server.forward-headers-strategy=native

# this is a regex matched against the IP of whoever created the tcp request. if there is no match Tomcat ignores the headers.
# connection must come from a regex specified below
server.tomcat.remoteip.internal-proxies=10\.0\.0\.0/8

###### MISC
#if the input json to the endpoint does not have the exact structure then the call is rejected.
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.servlet.multipart.max-file-size=10MB
#configure the directory to store sound files
app.sounds.directory=./sounds

app.audio-storage.base-path=./SoundAudio
app.audio-storage.allowed-mime-types=audio/mp3,audio/mpeg,audio/wav,audio/wave

# JWT signing secret. In production set JWT_SECRET env var.
app.jwt.secret=${JWT_SECRET:c2VjcmV0LWtleS1mb3ItZGV2LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}

# CORS — override in prod with the actual frontend origin
app.cors.allowed-origins=http://localhost:3000

# Admin configuration
app.admin.force-password-change=false

# Bootstrap SUPER_ADMIN — set APP_BOOTSTRAP_USERNAME and APP_BOOTSTRAP_PASSWORD env vars.
# Mandatory in prod (app-prod.properties); seeding is skipped if either is absent in dev/test.

# Rate limiting — login endpoint (per source IP)
app.rate-limit.login.capacity=10
app.rate-limit.login.refill-tokens=10
app.rate-limit.login.refill-period-seconds=60
